[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-game-collection"
version = "1.2.0"
description = "A tested collection of classic mini-games built with Python and Pygame."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
]
release = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
mini-game-collection = "main:run"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["games*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["games", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
